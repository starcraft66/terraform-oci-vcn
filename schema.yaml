schemaVersion: 1.1.0
version: "20190304"
locale: "en"
groupings:
  - title: "Create A VCN with optional gateways"
    variables:
    - region
    - compartment_id
    - vcn_cidrs_ipv4
    - vcn_name
    - vcn_dns_label
    - lockdown_default_seclist

variables:
  region:
    type: oci:identity:region:name
    title: Region
    description: The OCI region where resources will be created
    required: true

  compartment_id:
    type: oci:identity:compartment:id
    title: Target Compartment
    description: The target compartment id where to create all resources
    required: true

  label_prefix:
    type: string
    title: Label Prefix
    description: a string that will be prepended to all resources
    required: false
    default: dev

  vcn_cidrs_ipv4:
    type: list(string)
    title: VCN IPv4 CIDR
    default: ["10.0.0.0/16"]
    required: true

  vcn_name:
    type: string
    title: VCN Name
    required: true
    default: Test VCN

  vcn_dns_label:
    title: VCN DNS Label
    type: string
    required: false
    default: vcn

  lockdown_default_seclist:
    title: Enable VCN Default Security List Lockdown
    type: string
    required: false
    default: true

  attached_drg_id:
    title: DRG OCID to attach to the VCN
    type: string
    required: false
    default: null

  enable_ipv6:
    type: boolean
    title: Enable IPv6
    description: Whether IPv6 is enabled for the VCN
    required: false
    default: false

  vcn_is_oracle_gua_allocation_enabled:
    type: boolean
    title: Oracle GUA Allocation
    description: Whether Oracle assigns a GUA IPv6 /56 CIDR block to the VCN when IPv6 is enabled
    required: false
    default: true

  vcn_cidrs_ipv6:
    type: list(string)
    title: VCN IPv6 ULA CIDRs
    description: List of IPv6 ULA (private) CIDR blocks for the VCN
    required: false
    default: []

  freeform_tags:
    type: map
    visible: false
